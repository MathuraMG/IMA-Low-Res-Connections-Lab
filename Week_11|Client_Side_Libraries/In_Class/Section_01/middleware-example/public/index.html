<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Middleware example</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        input, button { font-size: 1rem; padding: 8px; margin: 4px 0; width: 100%; box-sizing: border-box; }
        button { cursor: pointer; }
        hr { margin: 24px 0; }
        #status { color: #b00; }
    </style>
</head>
<body>
    <h1>Announcements</h1>

    <h2>Open area (anyone)</h2>
    <button id="load">Show announcements</button>
    <div id="list"></div>

    <hr>

    <h2>Admin area (password needed)</h2>
    <input type="password" id="password" placeholder="admin password">
    <input type="text" id="message" placeholder="announcement">
    <button id="post">Post announcement</button>
    <p id="status"></p>

    <script src="app.js"></script>
</body>
</html>
